<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHEEZ CORNER Admin</title><style>body{margin:0;background:#120b0c;color:#fff;font:15px system-ui}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:#211316;border:1px solid #4a2c25;border-radius:18px;padding:20px;margin:14px 0}input,select,button{padding:11px;border-radius:10px;border:1px solid #76534a;background:#fff;color:#211316}button{font-weight:800;cursor:pointer;background:#f2bd55}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:16px;background:#2a191d;border-radius:14px}.stat b{display:block;font-size:25px;color:#ffd77b}.table{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #4a2c25;text-align:left;white-space:nowrap}th{color:#ffd77b}.hidden{display:none}.err{color:#ff9a9a}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><h1>CHEEZ CORNER</h1><p>Lead Command Center</p><section id="login" class="card"><h2>Admin Login</h2><input id="email" type="email" placeholder="Admin email"><input id="pass" type="password" placeholder="Password"><button id="loginBtn">Login</button><p id="loginErr" class="err"></p></section><main id="app" class="hidden"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Enquiries</h2><button id="logout">Logout</button></div><div class="grid"><div class="stat"><small>Total</small><b id="total">0</b></div><div class="stat"><small>New</small><b id="new">0</b></div><div class="stat"><small>Contacted</small><b id="contacted">0</b></div><div class="stat"><small>Booked</small><b id="booked">0</b></div></div><div class="card"><button id="refresh">Refresh</button></div><div class="card table"><table><thead><tr><th>Date</th><th>Name</th><th>Phone</th><th>Occasion</th><th>Guests</th><th>Event date</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></main></div><script>const U='https://dveftzvwtgvnjehwtkyd.supabase.co',K='sb_publishable_A0KOsxFpAfVb9g24MZH7kA_yJGkKAMl';let token=null;const $=x=>document.getElementById(x);async function auth(body){const r=await fetch(U+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error_description||d.msg||'Login failed');return d}async function api(path,opt={}){const r=await fetch(U+'/rest/v1/'+path,{...opt,headers:{apikey:K,Authorization:'Bearer '+token,'Content-Type':'application/json',...(opt.headers||{})}});if(!r.ok)throw Error(await r.text());return r.status===204?null:r.json()}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function load(){const d=await api('leads?select=*&order=created_at.desc');$('total').textContent=d.length;$('new').textContent=d.filter(x=>x.status==='new').length;$('contacted').textContent=d.filter(x=>x.status==='contacted').length;$('booked').textContent=d.filter(x=>x.status==='booked').length;$('rows').innerHTML=d.map(x=>'<tr><td>'+new Date(x.created_at).toLocaleString('en-IN')+'</td><td>'+esc(x.name)+'</td><td>'+esc(x.phone)+'</td><td>'+esc(x.occasion)+'</td><td>'+esc(x.guests)+'</td><td>'+esc(x.event_date||'—')+'</td><td><select onchange="status(\''+x.id+'\',this.value)">'+['new','contacted','quoted','booked','lost'].map(s=>'<option '+(x.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select></td><td><a href="https://wa.me/'+String(x.phone||'').replace(/\\D/g,'')+'" target="_blank">WhatsApp</a></td></tr>').join('')}async function status(id,v){await api('leads?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({status:v})});load()}$('loginBtn').onclick=async()=>{try{const d=await auth({email:$('email').value,password:$('pass').value});token=d.access_token;$('login').classList.add('hidden');$('app').classList.remove('hidden');await load()}catch(e){$('loginErr').textContent=e.message}};$('refresh').onclick=load;$('logout').onclick=()=>location.reload();</script></body></html>
